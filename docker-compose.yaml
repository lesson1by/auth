services:
  postgres:
    image: postgres:15-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: ./docker/.dockerfile
    depends_on:
      - postgres
    env_file: .env
    environment:
      DB_HOST: postgres
    ports:
      - "8080:8080"

volumes:
  postgres_data: